name: agent-checkpoint
version: 0.2.0
description: "Budget checkpoints for long runs: at 50% of a run's effective turn/time budget (tier 1) and at 80% time / 90% turns (tier 2, finalize), injects a durable-file persistence reminder via the pre_llm_call hook, and — since 0.2.0 — persists the checkpoint itself mid-run (checkpoint file + kanban comment) evaluated at tool-call boundaries and by a watchdog thread, so single-turn kanban runs cannot cross their budget silently. Fail-open, per-session latched, silent no-op when no cap is discoverable."
author: NousResearch
license: MIT
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_end
